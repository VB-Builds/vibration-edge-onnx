name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python train.py --out /tmp/vib_anomaly.onnx
      - run: python -m pytest -q
      - run: python -m edge.infer --sim --windows 20 --onset 8 > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: vibration-edge-onnx:ci
      - run: docker run --rm vibration-edge-onnx:ci --sim --windows 10 --onset 4
